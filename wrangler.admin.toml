name = "asem-pro-admin"
main = "cloudflare-worker/src/admin-site.js"
compatibility_date = "2025-09-01"
workers_dev = true
routes = [
  { pattern = "admin.radev.digital", custom_domain = true }
]

[assets]
directory = "./admin-panel"
binding = "ASSETS"

[[services]]
binding = "ASEM_AUTH"
service = "asem-pro-auth"
