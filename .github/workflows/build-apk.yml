name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Prepare Flutter project
        run: |
          set -e
          
          # Backup our custom files
          mkdir -p /tmp/backup
          cp -r mobile-app/lib /tmp/backup/lib
          cp mobile-app/pubspec.yaml /tmp/backup/pubspec.yaml
          cp mobile-app/android/app/google-services.json /tmp/backup/google-services.json
          [ -f mobile-app/analysis_options.yaml ] && cp mobile-app/analysis_options.yaml /tmp/backup/analysis_options.yaml
          
          # Remove old mobile-app and create fresh Flutter project
          rm -rf mobile-app
          flutter create --org com.taxopark --project-name driver --platforms android mobile-app
          
          # Restore our code
          rm -rf mobile-app/lib
          cp -r /tmp/backup/lib mobile-app/lib
          cp /tmp/backup/pubspec.yaml mobile-app/pubspec.yaml
          cp /tmp/backup/google-services.json mobile-app/android/app/google-services.json
          [ -f /tmp/backup/analysis_options.yaml ] && cp /tmp/backup/analysis_options.yaml mobile-app/analysis_options.yaml
          
          # Patch android/settings.gradle - add GMS plugin
          cat > mobile-app/android/settings.gradle << 'SETTINGS_EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.1.4" apply false
              id "org.jetbrains.kotlin.android" version "1.9.22" apply false
              id "com.google.gms.google-services" version "4.4.0" apply false
          }
          include ":app"
          SETTINGS_EOF
          
          # Patch app/build.gradle
          cat > mobile-app/android/app/build.gradle << 'BUILD_EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
              id "com.google.gms.google-services"
          }
          
          android {
              namespace "com.taxopark.driver"
              compileSdk flutter.compileSdkVersion
              ndkVersion flutter.ndkVersion
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
              defaultConfig {
                  applicationId "com.taxopark.driver"
                  minSdk 21
                  targetSdk flutter.targetSdkVersion
                  versionCode flutter.versionCode
                  versionName flutter.versionName
                  multiDexEnabled true
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          
          flutter {
              source "../.."
          }
          
          dependencies {
              implementation platform("com.google.firebase:firebase-bom:32.7.0")
              implementation "com.google.firebase:firebase-analytics"
          }
          BUILD_EOF
          
          # Fix Kotlin source directory
          mkdir -p mobile-app/android/app/src/main/kotlin/com/taxopark/driver
          cat > mobile-app/android/app/src/main/kotlin/com/taxopark/driver/MainActivity.kt << 'KOTLIN_EOF'
          package com.taxopark.driver
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          KOTLIN_EOF
          
          # Update AndroidManifest label
          sed -i 's/android:label="driver"/android:label="AsemPro"/' mobile-app/android/app/src/main/AndroidManifest.xml
          
          echo "=== Flutter project prepared ==="
          ls -la mobile-app/
          ls -la mobile-app/android/app/

      - name: Get dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Build APK
        working-directory: mobile-app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsemPro-Driver
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AsemPro v${{ github.run_number }}
          files: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          body: |
            AsemPro - Приложение для водителей таксопарка
            
            Скачайте APK и установите на Android устройство.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
