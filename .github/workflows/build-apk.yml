name: Build APK

on:
  push:
    branches: [ main, devin/1780299824-driver-edit-quota-qr ]
  pull_request:
    branches: [ main, devin/1780299824-driver-edit-quota-qr ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Analyze (non-blocking)
        working-directory: mobile-app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      # Релизная подпись: keystore и пароли берём из GitHub Secrets.
      # В репозиторий ключ НЕ коммитится. Если секрета нет (например, PR из форка) —
      # подпись пропускается и сборка идёт с debug-ключом (build.gradle сам решает).
      - name: Setup release signing
        if: env.KEYSTORE_BASE64 != ''
        working-directory: mobile-app/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$PWD/app/asempro-release.jks"
          cat > key.properties <<EOF
          storeFile=$PWD/app/asempro-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Build APK
        working-directory: mobile-app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs \
            mobile-app/build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsemPro-Driver
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: AsemPro v${{ github.run_number }}
          files: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          body: |
            AsemPro - Приложение для водителей таксопарка

            Подписанный релизный APK (signed with asempro-release.jks).
            Скачайте APK и установите на Android или загрузите в RuStore.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
