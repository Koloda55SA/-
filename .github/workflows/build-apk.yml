name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Initialize Flutter project
        run: |
          # Save our custom source files
          cp -r mobile-app/lib /tmp/our_lib
          cp mobile-app/pubspec.yaml /tmp/our_pubspec.yaml
          cp mobile-app/android/app/google-services.json /tmp/google-services.json
          
          # Create a proper Flutter project in mobile-app directory
          rm -rf mobile-app
          flutter create --org com.taxopark --project-name taxopark_driver mobile-app
          
          # Restore our custom source files
          rm -rf mobile-app/lib
          cp -r /tmp/our_lib mobile-app/lib
          cp /tmp/our_pubspec.yaml mobile-app/pubspec.yaml
          cp /tmp/google-services.json mobile-app/android/app/google-services.json
          
          # Add Google Services plugin to android/build.gradle
          cd mobile-app/android
          
          # Update settings.gradle to include google-services
          sed -i 's/id "com.android.application" version .* apply false/id "com.android.application" version "8.1.4" apply false\n    id "com.google.gms.google-services" version "4.4.0" apply false/' settings.gradle
          
          # Update app/build.gradle
          cd app
          # Add google-services plugin
          sed -i '/id "com.android.application"/a\    id "com.google.gms.google-services"' build.gradle
          # Add Firebase BOM dependency
          sed -i '/dependencies {/a\    implementation platform("com.google.firebase:firebase-bom:32.7.0")\n    implementation "com.google.firebase:firebase-analytics"' build.gradle
          # Set applicationId
          sed -i 's/namespace "com.taxopark.taxopark_driver"/namespace "com.taxopark.driver"/' build.gradle
          sed -i 's/applicationId "com.taxopark.taxopark_driver"/applicationId "com.taxopark.driver"/' build.gradle
          # Enable multidex
          sed -i '/minSdk/a\        multiDexEnabled true' build.gradle
          
          cd ../../..

      - name: Get dependencies
        working-directory: mobile-app
        run: flutter pub get

      - name: Build APK
        working-directory: mobile-app
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taxopark-driver-apk
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
