<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Выгрузка из Firebase</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #1d1b18; --muted: #6b665e; --line: #e4e0d8;
    --accent: #e8730c; --ok: #1f8a4c; --err: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14120f; --card: #1e1b17; --text: #f1ede6; --muted: #a59e92; --line: #34302a;
      --accent: #f28a2e; --ok: #4cc27f; --err: #ef6a5b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; }
  button { margin-top: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent);
    color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  td:last-child { text-align: right; }
  #log { white-space: pre-wrap; font: 13px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); margin: 0; }
  .ok { color: var(--ok); } .err { color: var(--err); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Выгрузка из Firebase</h1>
  <p class="sub">Читает данные AsemPro из Firestore и сохраняет их на этом компьютере для переноса на новый сервер. В Firebase ничего не меняется.</p>

  <section class="card" id="login-card">
    <form id="login-form">
      <label for="phone">Номер администратора</label>
      <input id="phone" type="tel" autocomplete="username" placeholder="+7 999 123-45-67" required>
      <label for="password">Пароль (тот же, что на сайте админки)</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Войти</button>
      <p id="login-error" class="err" hidden></p>
    </form>
  </section>

  <section class="card" id="work-card" hidden>
    <p id="who"></p>
    <table id="counts"><tbody></tbody></table>
    <button id="export-btn" disabled>Выгрузить</button>
  </section>

  <section class="card" id="log-card" hidden>
    <pre id="log"></pre>
  </section>
</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import {
  getFirestore, collection, doc, getDoc, getDocs, query, orderBy, limit, startAfter,
  documentId, getCountFromServer, Timestamp,
} from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

// Тот же проект, что у старого сайта админки и приложения.
const app = initializeApp({
  apiKey: 'AIzaSyDCZolgkxYj6fBvJ_OT1v6o5qVVmVKpuy8',
  authDomain: 'project-3077643193540297838.firebaseapp.com',
  projectId: 'project-3077643193540297838',
  appId: '1:126719829029:web:1314a91c649d4746f44bcc',
});
const auth = getAuth(app);
const db = getFirestore(app);

const COLLECTIONS = [
  ['admins', 'Сотрудники'],
  ['drivers', 'Водители'],
  ['waybills', 'Путевые листы'],
  ['supportChats', 'Диалоги поддержки'],
  ['payments', 'Оплаты'],
  ['deletionRequests', 'Заявки на удаление'],
];
const PBKDF2_ITER = 100000;   // как на сервере (cloudflare-api/src/auth.js)

const $ = id => document.getElementById(id);
const logBox = $('log');
function log(text, cls) {
  $('log-card').hidden = false;
  const line = document.createElement('span');
  if (cls) line.className = cls;
  line.textContent = text + '\n';
  logBox.appendChild(line);
}

function normalizePhone(raw) {
  let phone = String(raw || '').replace(/[\s()\-]/g, '');
  if (phone.startsWith('8') && phone.length === 11) phone = '+7' + phone.slice(1);
  if (/^9\d{9}$/.test(phone)) phone = '+7' + phone;
  if (!phone.startsWith('+')) phone = '+' + phone;
  return phone;
}

// Значения Firestore → обычный JSON (время — миллисекунды).
function plain(v) {
  if (v instanceof Timestamp) return v.toMillis();
  if (Array.isArray(v)) return v.map(plain);
  if (v && typeof v === 'object') {
    if (typeof v.toMillis === 'function') return v.toMillis();
    if (typeof v.path === 'string' && v.firestore) return v.path;   // ссылка на документ
    const o = {};
    for (const [k, x] of Object.entries(v)) o[k] = plain(x);
    return o;
  }
  return v;
}
const docOut = d => ({ id: d.id, data: plain(d.data()) });

async function hashPassword(password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-256', salt, iterations: PBKDF2_ITER }, key, 256));
  const b64 = bytes => btoa(String.fromCharCode(...bytes));
  return { passHash: b64(bits), passSalt: b64(salt), passIter: PBKDF2_ITER };
}

async function save(name, payload) {
  const res = await fetch('/save?name=' + encodeURIComponent(name), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error('Не удалось сохранить ' + name + ' (' + res.status + ')');
}

// Читаем коллекцию страницами по id документа.
async function readPaged(col, pageSize, onPage) {
  let last = null;
  for (;;) {
    const q = last
      ? query(col, orderBy(documentId()), startAfter(last), limit(pageSize))
      : query(col, orderBy(documentId()), limit(pageSize));
    const snap = await getDocs(q);
    if (snap.empty) return;
    await onPage(snap.docs);
    last = snap.docs[snap.docs.length - 1];
    if (snap.size < pageSize) return;
  }
}

// Подколлекции (заметки, сообщения) — по 10 документов параллельно.
async function withSub(docs, sub, key) {
  const out = [];
  for (let i = 0; i < docs.length; i += 10) {
    const part = await Promise.all(docs.slice(i, i + 10).map(async d => {
      const s = await getDocs(collection(d.ref, sub));
      return { ...docOut(d), [key]: s.docs.map(docOut) };
    }));
    out.push(...part);
  }
  return out;
}

let meta = null;

$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const phone = normalizePhone($('phone').value);
  const password = ($('password').value || '').trim();
  $('login-error').hidden = true;
  $('login-btn').disabled = true;
  try {
    const email = phone.replace(/\D/g, '') + '@asempro.admin';
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const adminDoc = await getDoc(doc(db, 'admins', cred.user.uid));
    const role = adminDoc.exists() ? (adminDoc.data().role || 'admin') : null;
    if (role !== 'admin') {
      await signOut(auth);
      throw new Error('Выгрузку делает только администратор');
    }
    // Пароль администратора переносим как есть: на новом сервере он войдёт
    // с тем же паролем. Сам пароль никуда не сохраняется — только его хэш.
    const hash = await hashPassword(password);
    $('password').value = '';
    meta = { exportedAt: Date.now(), adminUid: cred.user.uid, adminPhone: phone, ...hash };

    $('login-card').hidden = true;
    $('work-card').hidden = false;
    $('who').textContent = 'Вход выполнен: ' + phone + '. Считаю документы…';
    const tbody = $('counts').querySelector('tbody');
    meta.counts = {};
    for (const [name, label] of COLLECTIONS) {
      const c = await getCountFromServer(collection(db, name));
      meta.counts[name] = c.data().count;
      const tr = document.createElement('tr');
      tr.innerHTML = '<td></td><td></td>';
      tr.children[0].textContent = label;
      tr.children[1].textContent = String(meta.counts[name]);
      tbody.appendChild(tr);
    }
    $('who').textContent = 'Вход выполнен: ' + phone + '. Документов в Firebase:';
    $('export-btn').disabled = false;
  } catch (err) {
    $('login-error').textContent = err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password'
      ? 'Неверный номер или пароль' : (err.message || String(err));
    $('login-error').hidden = false;
    $('login-btn').disabled = false;
  }
});

$('export-btn').addEventListener('click', async () => {
  $('export-btn').disabled = true;
  const started = Date.now();
  try {
    const admins = await getDocs(collection(db, 'admins'));
    await save('admins', { docs: admins.docs.map(docOut) });
    log('Сотрудники: ' + admins.size);

    const company = await getDoc(doc(db, 'settings', 'company'));
    await save('settings', { company: company.exists() ? plain(company.data()) : null });
    log('Настройки организации: ' + (company.exists() ? 'есть' : 'нет'));

    const drivers = await getDocs(collection(db, 'drivers'));
    await save('drivers', { docs: await withSub(drivers.docs, 'notes', 'notes') });
    log('Водители (с заметками): ' + drivers.size);

    let page = 0;
    let wb = 0;
    await readPaged(collection(db, 'waybills'), 300, async (docs) => {
      page++;
      await save('waybills-' + String(page).padStart(4, '0'), { docs: docs.map(docOut) });
      wb += docs.length;
      log('Путевые листы: ' + wb + ' из ' + meta.counts.waybills);
    });

    const chats = await getDocs(collection(db, 'supportChats'));
    await save('support', { docs: await withSub(chats.docs, 'messages', 'messages') });
    log('Диалоги поддержки (с сообщениями): ' + chats.size);

    const payments = await getDocs(collection(db, 'payments'));
    await save('payments', { docs: payments.docs.map(docOut) });
    log('Оплаты: ' + payments.size);

    const deletions = await getDocs(collection(db, 'deletionRequests'));
    await save('deletions', { docs: deletions.docs.map(docOut) });
    log('Заявки на удаление: ' + deletions.size);

    // meta — последним: по нему видно, что выгрузка завершена целиком.
    meta.waybillPages = page;
    meta.finishedAt = Date.now();
    await save('meta', meta);
    log('Готово за ' + Math.round((Date.now() - started) / 1000) + ' с. Можно закрыть страницу.', 'ok');
  } catch (err) {
    log('Ошибка: ' + (err.message || err), 'err');
    $('export-btn').disabled = false;
  } finally {
    await signOut(auth).catch(() => {});
  }
});
</script>
</body>
</html>
