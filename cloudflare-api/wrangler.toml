name = "asem-pro-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "asem-pro"
# База в регионе EEUR (Восточная Европа) — ближе к водителям.
database_id = "5ba5fb32-3c9f-497e-b1e6-3133fd4d9021"
migrations_dir = "migrations"

[vars]
# Сайты, которым разрешено обращаться к API из браузера (через запятую).
ALLOWED_ORIGINS = "https://taxopark-admin.pages.dev,http://localhost:8765"

# Секрет для создания первого администратора (POST /api/bootstrap) задаётся так:
#   wrangler secret put BOOTSTRAP_SECRET
